name: og_messenger
description: OG Messenger - A serverless LAN messenger for private networks
publish_to: none
version: 0.0.0
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.1
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.3
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^21.0.0
  json_annotation: ^4.11.0
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  crypto: ^3.0.5
  pointycastle: ^4.0.0
  asn1lib: ^1.5.5
  another_flushbar: ^1.12.30
  fuzzywuzzy: ^1.1.0
  emoji_picker_flutter: ^4.4.0
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.1
  flutter_launcher_icons: ^0.14.2
  sqflite_common_ffi: ^2.3.0
flutter:
  uses-material-design: true
  assets:
    - images/og_messenger.png
    - images/og_messenger.dark.png
    - images/og_messenger_icon.png
    - images/og_messenger_icon.dark.png
    - images/og_messenger_no_messages.png
    - images/og_messenger_no_messages.dark.png
    - images/og_messenger_rooms.png
    - images/og_messenger_rooms.dark.png
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: images/og_messenger_icon.dark.png
  windows:
    generate: true
    image_path: images/og_messenger_icon.dark.png
  linux: true
  image_path: images/og_messenger_icon.dark.png
  image_path_android: images/og_messenger_icon.png
  image_path_ios: images/og_messenger_icon.dark.png
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: images/og_messenger_icon.png
  adaptive_icon_foreground_light: images/og_messenger_icon.png
  adaptive_icon_foreground_dark: images/og_messenger_icon.dark.png
