name: Build APK
description: Builds an installable APK for android users

inputs:
  filename:
    description: The filename to create
    required: true
  type:
    default: release
    description: debug or release

runs:
  using: composite
  steps:
    - shell: bash
      run: flutter build apk --${{ inputs.type }}
    - shell: bash
      run: mv build/app/outputs/flutter-apk/app-${{ inputs.type }}.apk "${{ inputs.filename }}"
