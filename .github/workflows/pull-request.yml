name: pull-request

on:
  pull_request:

concurrency:
  cancel-in-progress: true
  group: pr-${{ github.head_ref }}

jobs:
  pr-prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - run: echo "author_association=${{ github.event.pull_request.author_association }}"
      - id: set-version
        run: |
          VERSION="${{ github.head_ref }}"
          echo "version=${VERSION//\//-}" >> $GITHUB_OUTPUT

  pr-test:
    uses: ./.github/workflows/test.yml

  pr-build:
    needs: [pr-prepare, pr-test]
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      author-is-collaborator: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      version: ${{ needs.pr-prepare.outputs.version }}
