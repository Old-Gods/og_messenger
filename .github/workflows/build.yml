name: Build

on:
  workflow_call:
    inputs:
      author-is-collaborator:
        default: true
        description: Has the author, of this commit, a collaborator of this repository?
        required: false
        type: boolean
      version:
        description: A build version to add to the name
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64 encoded version of your keystore file
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        description: Your keystore password
        required: true
      ANDROID_KEY_PASSWORD:
        description: Your key password
        required: true
      ANDROID_KEY_ALIAS:
        description: The key alias to use
        required: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APK_NAME: OG-Messenger-Android-${{ inputs.version }}.apk
      AAB_NAME: OG-Messenger-Android-${{ inputs.version }}.aab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - if: inputs.author-is-collaborator
        uses: ./.github/actions/configure-android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: flutter pub get
      - uses: ./.github/actions/build-apk
        with:
          filename: ${{ env.APK_NAME }}
          type: ${{ inputs.author-is-collaborator && 'release' || 'debug' }}
      - if: inputs.author-is-collaborator
        uses: actions/upload-artifact@v6
        with:
          name: build-apk
          path: ${{ env.APK_NAME }}
      # - uses: ./.github/actions/build-aap
      #   with:
      #     filename: ${{ env.AAB_NAME }}
      # - if: inputs.author-is-collaborator
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: build-aab
      #     path: ${{ env.AAB_NAME }}

  build-ios:
    runs-on: macos-latest
    env:
      BUILD_NAME: OG-Messenger-iOS-${{ inputs.version }}.zip
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: | # shell
          cd build/ios/iphoneos
          zip -r "../../../$BUILD_NAME" Runner.app
      - if: inputs.author-is-collaborator
        uses: actions/upload-artifact@v6
        with:
          name: build-ios
          path: ${{ env.BUILD_NAME }}

  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: OG-Messenger-Linux-${{ inputs.version }}.tar.gz
    steps:
      - uses: actions/checkout@v6
      - run: | # shell
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: | # shell
          cd build/linux/x64/release/bundle
          tar -czf "../../../../../$BUILD_NAME" *
      - if: inputs.author-is-collaborator
        uses: actions/upload-artifact@v6
        with:
          name: build-linux
          path: ${{ env.BUILD_NAME }}

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_NAME: OG-Messenger-macos-${{ inputs.version }}.dmg
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - run: | # shell
          hdiutil create \
            -volname "OG Messenger" \
            -srcfolder "build/macos/Build/Products/Release/OG Messenger.app" \
            -ov \
            -format UDZO \
            "${{ env.BUILD_NAME }}"
      - if: inputs.author-is-collaborator
        uses: actions/upload-artifact@v6
        with:
          name: build-macos
          path: ${{ env.BUILD_NAME }}

  build-windows:
    runs-on: windows-latest
    env:
      BUILD_NAME: OG-Messenger-Windows-${{ inputs.version }}.zip
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ${{ env.BUILD_NAME }}
      - if: inputs.author-is-collaborator
        uses: actions/upload-artifact@v6
        with:
          name: build-windows
          path: ${{ env.BUILD_NAME }}
