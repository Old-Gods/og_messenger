name: Build

on:
  workflow_call:
    inputs:
      version:
        description: A build version to add to the name
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        description: Base64 encoded version of your keystore file
      ANDROID_KEYSTORE_PASSWORD:
        description: Your keystore password
      ANDROID_KEY_PASSWORD:
        description: Your key password
      ANDROID_KEY_ALIAS:
        description: The key alias to use

env:
  has-secrets: ${{ secrets.ANDROID_KEY_ALIAS != '' }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      APK_NAME: OG-Messenger-Android-${{ inputs.version }}.apk
      AAB_NAME: OG-Messenger-Android-${{ inputs.version }}.aab
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
      - uses: ./.github/actions/install
      - if: env.has-secrets == 'true'
        uses: ./.github/actions/configure-android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: ./.github/actions/build-apk
        with:
          filename: ${{ env.APK_NAME }}
          type: ${{ env.has-secrets == 'true' && 'release' || 'debug' }}
      - if: env.has-secrets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-apk
          path: ${{ env.APK_NAME }}
      # - uses: ./.github/actions/build-aap
      #   with:
      #     filename: ${{ env.AAB_NAME }}
      # - if: env.has-secrets
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: build-aab
      #     path: ${{ env.AAB_NAME }}

  build-ios:
    runs-on: macos-latest
    env:
      BUILD_NAME: OG-Messenger-iOS-${{ inputs.version }}.zip
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - uses: ./.github/actions/build-ios
        with:
          filename: ${{ env.BUILD_NAME }}
      - if: env.has-secrets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-ios
          path: ${{ env.BUILD_NAME }}

  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: OG-Messenger-Linux-${{ inputs.version }}.tar.gz
    steps:
      - uses: actions/checkout@v6
      - run: | # shell
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: ./.github/actions/install
      - uses: ./.github/actions/build-linux
        with:
          filename: ${{ env.BUILD_NAME }}
      - if: env.has-secrets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: ${{ env.BUILD_NAME }}

  build-macos:
    runs-on: macos-latest
    env:
      BUILD_NAME: OG-Messenger-macos-${{ inputs.version }}.dmg
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - uses: ./.github/actions/build-dmg
        with:
          filename: ${{ env.BUILD_NAME }}
      - if: env.has-secrets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: ${{ env.BUILD_NAME }}

  build-windows:
    runs-on: windows-latest
    env:
      BUILD_NAME: OG-Messenger-Windows-${{ inputs.version }}.zip
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - uses: ./.github/actions/build-windows
        with:
          filename: ${{ env.BUILD_NAME }}
      - if: env.has-secrets == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: ${{ env.BUILD_NAME }}
